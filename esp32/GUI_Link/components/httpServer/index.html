<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon WiFi Setup</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-2: #1f232c;
    --accent: #4f8cff;
    --accent-2: #34d399;
    --danger: #f87171;
    --text: #e7e9ee;
    --text-dim: #8b93a3;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; }
  header .logo {
    width: 56px; height: 56px; margin: 0 auto 10px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { color: var(--text-dim); font-size: 13px; margin: 0; }

  .status-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
  .status-dot.on { background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
  .status-dot.off { background: var(--danger); }
  .status-text { font-size: 13px; color: var(--text-dim); line-height: 1.4; }
  .status-text b { color: var(--text); font-weight: 600; }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 10px;
  }
  .section-title span { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .rescan-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .rescan-btn:active { background: var(--card-2); }
  .rescan-btn:disabled { opacity: .5; }

  .list { display: flex; flex-direction: column; gap: 8px; }

  .net {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .net-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
  }
  .net-row:active { background: var(--card-2); }
  .bars { width: 22px; height: 16px; flex-shrink: 0; }
  .bars rect { fill: var(--text-dim); }
  .bars rect.lit { fill: var(--accent); }
  .net-name { flex: 1; font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lock { color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
  .chev { color: var(--text-dim); font-size: 12px; flex-shrink: 0; transition: transform .15s; }
  .net.open .chev { transform: rotate(90deg); }

  .net-form {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
  }
  .net.open .net-form { display: block; padding-top: 12px; }

  .net-form input[type="password"], .net-form input[type="text"] {
    width: 100%;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .net-form .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .net-form .row label { font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }

  .connect-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 11px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .connect-btn:disabled { opacity: .6; }

  .form-msg { font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  .form-msg.err { color: var(--danger); }
  .form-msg.ok { color: var(--accent-2); }

  .empty, .loading {
    text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 30px 0;
  }
  .spinner {
    width: 22px; height: 22px; margin: 0 auto 10px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; margin-top: 26px; font-size: 11.5px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📡</div>
    <h1>Beacon WiFi Setup</h1>
    <p>Pick a network for your device to join</p>
  </header>

  <div class="status-card">
    <div id="statusDot" class="status-dot"></div>
    <div class="status-text" id="statusText">Checking connection…</div>
  </div>

  <div class="section-title">
    <span id="listLabel">Nearby networks</span>
    <button class="rescan-btn" id="rescanBtn" onclick="loadNetworks()">Rescan</button>
  </div>

  <div class="list" id="list">
    <div class="loading"><div class="spinner"></div>Scanning…</div>
  </div>

  <footer>Reach this page anytime at <b>http://beacon.local</b></footer>
</div>

<script>
function signalBars(rssi) {
  // rough dBm -> 1..4 bar mapping
  let level = 1;
  if (rssi >= -55) level = 4;
  else if (rssi >= -67) level = 3;
  else if (rssi >= -78) level = 2;
  const heights = [4, 7, 10, 13];
  let bars = '';
  for (let i = 0; i < 4; i++) {
    const h = heights[i];
    const y = 16 - h;
    const lit = i < level ? 'lit' : '';
    bars += `<rect class="${lit}" x="${i * 6}" y="${y}" width="4" height="${h}" rx="1"></rect>`;
  }
  return `<svg class="bars" viewBox="0 0 22 16">${bars}</svg>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function refreshStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if (data.connected) {
      dot.className = 'status-dot on';
      text.innerHTML = `Connected — <b>${escapeHtml(data.ip)}</b> (${data.rssi} dBm)`;
    } else {
      dot.className = 'status-dot off';
      text.innerHTML = `Not connected to a network yet. Pick one below.`;
    }
  } catch (e) {
    document.getElementById('statusText').textContent = 'Status unavailable';
  }
}

function closeAllExcept(exceptEl) {
  document.querySelectorAll('.net.open').forEach(el => {
    if (el !== exceptEl) el.classList.remove('open');
  });
}

function toggleNet(el) {
  const wasOpen = el.classList.contains('open');
  closeAllExcept(el);
  el.classList.toggle('open', !wasOpen);
  if (!wasOpen) {
    const input = el.querySelector('input[type="password"], input[type="text"]');
    if (input) setTimeout(() => input.focus(), 50);
  }
}

async function submitConnect(el, ssid, secure) {
  const btn = el.querySelector('.connect-btn');
  const msg = el.querySelector('.form-msg');
  const passInput = el.querySelector('.pass-input');
  const password = secure ? passInput.value : '';

  if (secure && password.length === 0) {
    msg.textContent = 'Enter the network password';
    msg.className = 'form-msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Connecting…';
  msg.textContent = 'Sending request…';
  msg.className = 'form-msg';

  try {
    const res = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ssid, password })
    });
    const data = await res.json();

    if (data.status === 'connecting') {
      // The device replies right away, then reconnects in the background —
      // if you were browsing it over the same network you just told it to
      // leave, this page may itself lose the connection for a few seconds.
      msg.textContent = 'Connecting… this page may briefly disconnect';
      msg.className = 'form-msg';
      pollForConnectResult(ssid, msg, btn);
    } else if (data.status === 'busy') {
      msg.textContent = data.message || 'Already connecting to another network';
      msg.className = 'form-msg err';
      btn.disabled = false;
      btn.textContent = 'Connect';
    } else {
      msg.textContent = data.message || 'Could not connect';
      msg.className = 'form-msg err';
      btn.disabled = false;
      btn.textContent = 'Connect';
    }
  } catch (e) {
    msg.textContent = 'Request failed — try again';
    msg.className = 'form-msg err';
    btn.disabled = false;
    btn.textContent = 'Connect';
  }
}

function pollForConnectResult(ssid, msg, btn) {
  const start = Date.now();
  const timeoutMs = 20000;

  const iv = setInterval(async () => {
    let data = null;
    try {
      const res = await fetch('/api/status');
      data = await res.json();
    } catch (e) {
      /* Expected during the brief blip while the STA link resets —
       * keep polling rather than failing on the first miss. */
    }

    if (data && data.connected) {
      clearInterval(iv);
      msg.textContent = `Connected! Device IP: ${data.ip}`;
      msg.className = 'form-msg ok';
      btn.disabled = false;
      btn.textContent = 'Connect';
      refreshStatus();
      return;
    }

    if (Date.now() - start > timeoutMs) {
      clearInterval(iv);
      msg.textContent = 'No response yet — check the password, or that you\'re still on the right network, and try again';
      msg.className = 'form-msg err';
      btn.disabled = false;
      btn.textContent = 'Connect';
    }
  }, 1500);
}

function renderNetworks(networks) {
  const list = document.getElementById('list');
  list.innerHTML = '';

  if (!networks.length) {
    list.innerHTML = '<div class="empty">No networks found nearby.</div>';
    return;
  }

  networks.forEach((n, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'net';
    const safeId = 'net' + idx;

    wrap.innerHTML = `
      <div class="net-row">
        ${signalBars(n.rssi)}
        <div class="net-name">${escapeHtml(n.ssid)}</div>
        <div class="lock">${n.secure ? '🔒' : ''}</div>
        <div class="chev">›</div>
      </div>
      <div class="net-form">
        ${n.secure ? `
          <div class="row">
            <input class="pass-input" id="${safeId}-pass" type="password" placeholder="Network password">
          </div>
          <div class="row">
            <label><input type="checkbox" onclick="document.getElementById('${safeId}-pass').type = this.checked ? 'text' : 'password'"> Show password</label>
          </div>
        ` : `<div class="row"><label>Open network — no password needed</label></div>`}
        <button class="connect-btn">Connect</button>
        <div class="form-msg"></div>
      </div>
    `;

    wrap.querySelector('.net-row').addEventListener('click', () => toggleNet(wrap));
    wrap.querySelector('.connect-btn').addEventListener('click', () => submitConnect(wrap, n.ssid, n.secure));

    list.appendChild(wrap);
  });
}

async function loadNetworks() {
  const btn = document.getElementById('rescanBtn');
  const list = document.getElementById('list');
  btn.disabled = true;
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning…</div>';

  try {
    const res = await fetch('/api/scan');
    const data = await res.json();
    renderNetworks(data);
  } catch (e) {
    list.innerHTML = '<div class="empty">Scan failed. Tap Rescan to try again.</div>';
  } finally {
    btn.disabled = false;
  }
}

refreshStatus();
loadNetworks();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
